<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج الاتصال</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .form-container {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin: 0 0 20px;
      color: #333;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: 0;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <div class="form-container">
    <h2>تواصل معنا</h2>

    <form action="https://formspree.io/f/xvkpvdvv" method="POST">

      <div class="form-group">
        <label for="email">البريد الإلكتروني:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@mail.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="message">الرسالة:</label>
        <textarea
          id="message"
          name="message"
          placeholder="اكتب رسالتك هنا..."
          required
        ></textarea>
      </div>

      <button type="submit">إرسال</button>

    </form>
  </div>

</body>
</html>
