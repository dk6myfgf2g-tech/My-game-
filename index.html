<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال رسالة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #006699;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>أرسل رسالتك</h2>
    <textarea id="userMessage" placeholder="اكتب رسالتك أو بياناتك هنا..."></textarea>
    <button onclick="sendToTelegram()">إرسال إلى تلغرام</button>
    <div id="status"></div>
</div>

<script>
function sendToTelegram() {
    // بياناتك الخاصة المسجلة سابقاً
    const token = "8765312624:AAF5cD-VCsNGRVbgH2eh1g8NdqmH49Bvi3M";
    const chatId = "5775368729";
    
    const messageInput = document.getElementById("userMessage").value;
    const statusDiv = document.getElementById("status");

    if (messageInput.trim() === "") {
        statusDiv.style.color = "red";
        statusDiv.innerText = "⚠️ يرجى كتابة النص أولاً!";
        return;
    }

    statusDiv.style.color = "#555";
    statusDiv.innerText = "جاري الإرسال...";

    // إعداد نص الرسالة
    const text = encodeURIComponent("📩 رسالة جديدة من الموقع:\n\n" + messageInput);
    const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${text}`;

    // إرسال الطلب إلى API تلغرام
    fetch(url)
    .then(response => response.json())
    .then(data => {
        if (data.ok) {
            statusDiv.style.color = "green";
            statusDiv.innerText = "✅ تم الإرسال بنجاح إلى التلغرام!";
            document.getElementById("userMessage").value = ""; // تفريغ الخانة
        } else {
            statusDiv.style.color = "red";
            statusDiv.innerText = "❌ حدث خطأ أثناء الإرسال.";
        }
    })
    .catch(error => {
        statusDiv.style.color = "red";
        statusDiv.innerText = "❌ تعذر الاتصال بالسيرفر.";
        console.error("Error:", error);
    });
}
</script>

</body>
</html>
