<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة القفز</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(#87ceeb 0%, #dff6ff 70%, #7ac943 70%);
    }

    #player {
      position: absolute;
      width: 45px;
      height: 45px;
      background: #ff3333;
      border-radius: 50%;
      left: 80px;
      bottom: 30%;
    }

    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 30%;
      background: #55a832;
    }

    .obstacle {
      position: absolute;
      bottom: 30%;
      width: 45px;
      height: 60px;
      background: #333;
      border-radius: 8px;
    }

    #score {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 28px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px #000;
      z-index: 5;
    }

    #gameOver {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.65);
      color: white;
      z-index: 10;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 35px;
    }

    button {
      margin-top: 20px;
      padding: 15px 35px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      background: #22c55e;
      color: white;
    }
  </style>
</head>

<body>

<div id="game">
  <div id="score">النقاط: 0</div>
  <div id="player"></div>
  <div id="ground"></div>

  <div id="gameOver">
    <div>انتهت اللعبة 😵</div>
    <div id="finalScore"></div>
    <button onclick="location.reload()">إعادة اللعب</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
