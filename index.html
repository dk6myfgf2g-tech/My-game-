<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرسل رسالتك</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  background:#f5f5fa;
  font-family:Arial,"Tahoma",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 0;
}

.card{
  width:100%;
  max-width:710px;
  background:#fff;
  border-radius:24px;
  padding:75px 46px 72px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}

h1{
  margin:0 0 38px;
  text-align:center;
  color:#222;
  font-size:42px;
  font-weight:700;
}

textarea{
  display:block;
  width:100%;
  height:255px;
  resize:none;
  border:2px solid #d5d5d5;
  border-radius:17px;
  outline:none;
  padding:28px 24px;
  font-size:22px;
  font-family:inherit;
  color:#222;
  direction:rtl;
  background:#fff;
}

textarea::placeholder{
  color:#aaa;
  opacity:1;
}

textarea:focus{
  border-color:#1597d1;
}

.send{
  width:100%;
  height:82px;
  margin-top:35px;
  border:0;
  border-radius:16px;
  background:#1196d2;
  color:white;
  font-family:inherit;
  font-size:28px;
  cursor:pointer;
  transition:.15s;
}

.send:active{
  transform:scale(.98);
}

@media(max-width:600px){

  body{
    padding:0;
    align-items:center;
  }

  .card{
    width:100%;
    border-radius:22px;
    padding:70px 46px 72px;
  }

  h1{
    font-size:36px;
    margin-bottom:35px;
  }

  textarea{
    height:220px;
    font-size:19px;
    padding:25px 20px;
  }

  .send{
    height:82px;
    font-size:25px;
    margin-top:35px;
  }
}
</style>
</head>

<body>

<div class="card">

  <h1>أرسل رسالتك</h1>

  <textarea
    id="message"
    maxlength="1000"
    placeholder="اكتب رسالتك أو بياناتك هنا..."
    autocomplete="off"></textarea>

  <button class="send" onclick="sendMessage()">
    إرسال
  </button>

</div>

<script>
function sendMessage(){

  const message = document.getElementById("message").value.trim();

  if(!message){
    alert("اكتب رسالتك أولاً");
    return;
  }

  /*
    ضع هنا رابط الـBackend الآمن الخاص بك
    لإرسال الرسالة إلى Telegram.
  */

  alert("تم تجهيز الرسالة للإرسال ✅");

  document.getElementById("message").value = "";
}
</script>

</body>
</html>
