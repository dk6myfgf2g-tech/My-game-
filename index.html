<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أمان حسابك</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#6157d8,#00b8d4);
}

.card{
width:calc(100% - 40px);
max-width:460px;
background:#fff;
border-radius:28px;
padding:38px 32px 32px;
text-align:center;
box-shadow:0 20px 50px #0003;
}

.title{
font-size:29px;
font-weight:800;
margin-bottom:8px;
color:#111;
}

.check{
display:inline-flex;
width:28px;
height:28px;
border-radius:50%;
background:#2196f3;
color:white;
align-items:center;
justify-content:center;
font-size:18px;
}

.subtitle{
color:#999;
font-size:16px;
margin-bottom:32px;
}

input{
width:100%;
height:68px;
border:2px solid #ddd;
border-radius:15px;
padding:0 20px;
font-size:18px;
outline:none;
text-align:right;
}

input:focus{
border-color:#6285e8;
}

button{
width:100%;
height:68px;
margin-top:18px;
border:0;
border-radius:15px;
background:linear-gradient(90deg,#6653d9,#08acd0);
color:#fff;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.lang{
background:#eee;
color:#333;
}

.note{
margin-top:28px;
font-size:13px;
color:#999;
}
</style>
</head>

<body>

<div class="card">

<div class="title">
<span class="check">✓</span>
أمان حسابك
</div>

<div class="subtitle">
اختبار تجريبي
</div>

<input
id="message"
type="text"
maxlength="500"
placeholder="اكتب رسالة تجريبية"
autocomplete="off">

<button onclick="sendTelegram()">
إرسال
</button>

<button class="lang" onclick="openTelegram()">
Français / English 🌐
</button>

<div class="note">
تجربة تعليمية — لا تدخل معلومات حساسة
</div>

</div>

<script>

function sendTelegram(){

const msg=document.getElementById("message").value.trim();

if(!msg){
alert("اكتب رسالة تجريبية");
return;
}

/*
الإرسال الصامت إلى Telegram يحتاج Backend
حتى لا يتم كشف Bot Token داخل GitHub Pages.
*/

const text=encodeURIComponent(
"📩 رسالة تجريبية:\n\n"+msg
);

window.open(
"https://t.me/share/url?url=&text="+text,
"_blank"
);

}

function openTelegram(){

window.open(
"https://t.me/",
"_blank"
);

}

</script>

</body>
</html>
