<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار أمان الحساب</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #6a5acd, #00bcd4);
}

.card {
  width: 92%;
  max-width: 380px;
  background: white;
  padding: 32px 25px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 15px 45px rgba(0,0,0,.2);
}

.title {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 10px;
}

.subtitle {
  color: #777;
  font-size: 13px;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 12px;
  outline: none;
  font-size: 16px;
  transition: .2s;
}

input:focus {
  border-color: #6a5acd;
  box-shadow: 0 0 0 3px rgba(106,90,205,.12);
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(90deg, #6a5acd, #00a8cc);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
}

button:active {
  transform: scale(.97);
}

#result {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 12px;
  background: #e9fff0;
  color: #16803c;
  font-weight: bold;
}

.note {
  margin-top: 18px;
  color: #888;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="card">

  <div class="title">
    أمان حسابك
  </div>

  <div class="subtitle">
    اختبار قوة كلمة جديدة
  </div>

  <input
    id="password"
    type="text"
    placeholder="كلمة جديدة قوية"
    autocomplete="off"
  >

  <button onclick="checkStrength()">
    فحص القوة
  </button>

  <div id="result"></div>

  <div class="note">
    اختبار تعليمي — لا تدخل كلمة سر حقيقية
  </div>

</div>

<script>
function checkStrength() {

  const value = document.getElementById("password").value;
  const result = document.getElementById("result");

  if (!value.trim()) {
    result.style.display = "block";
    result.style.background = "#ffeaea";
    result.style.color = "#b00000";
    result.textContent = "اكتب كلمة أولاً";
    return;
  }

  let score = 0;

  if (value.length >= 8) score++;
  if (/[A-Z]/.test(value)) score++;
  if (/[a-z]/.test(value)) score++;
  if (/[0-9]/.test(value)) score++;
  if (/[^A-Za-z0-9]/.test(value)) score++;

  let strength;

  if (score <= 2) {
    strength = "ضعيفة";
  } else if (score <= 4) {
    strength = "متوسطة";
  } else {
    strength = "قوية جدًا";
  }

  result.style.display = "block";
  result.style.background = "#e9fff0";
  result.style.color = "#16803c";
  result.textContent = "قوة الكلمة: " + strength;
}
</script>

</body>
</html>
