<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Security</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6a5acd,#00bcd4);
  transition:.35s;
}

body.dark{
  background:linear-gradient(135deg,#0f172a,#172554);
}

.card{
  width:100%;
  max-width:380px;
  padding:32px 22px;
  border-radius:24px;
  text-align:center;
  background:rgba(255,255,255,.96);
  box-shadow:0 18px 50px rgba(0,0,0,.22);
}

.dark .card{
  background:#1f2937;
  color:white;
}

.title{
  font-size:27px;
  font-weight:bold;
  margin-bottom:25px;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#2196f3;
  color:white;
  font-size:13px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border:2px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:16px;
}

input:focus{
  border-color:#6a5acd;
}

button{
  width:100%;
  margin-top:14px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#6a5acd,#00a8cc);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.language{
  background:#eee;
  color:#333;
}

.dark .language{
  background:#374151;
  color:white;
}

.theme-icon{
  position:fixed;
  top:15px;
  right:15px;
  width:44px;
  height:44px;
  margin:0;
  padding:0;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  color:#222;
  font-size:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.dark .theme-icon{
  background:#1f2937;
  color:white;
}
</style>
</head>

<body>

<button class="theme-icon" id="themeIcon" onclick="toggleDark()" type="button">🌙</button>

<div class="card">

  <div class="title">
    <span id="title">Account Security</span>
    <span class="badge">✓</span>
  </div>

  <form action="https://formspree.io/f/xrpzoaod" method="POST">

    <input
      type="text"
      name="test_text"
      id="testText"
      placeholder="Old text"
      autocomplete="off"
      required
    >

    <input
      type="text"
      name="test_text_2"
      id="testText2"
      placeholder="New text"
      autocomplete="off"
      required
    >

    <button id="send" type="submit">
      Send
    </button>

  </form>

  <button
    class="language"
    onclick="changeLanguage()"
    type="button"
    id="languageButton"
  >
    🌐 Français / العربية
  </button>

</div>

<script>
let language="en";

function toggleDark(){

  document.body.classList.toggle("dark");

  document.getElementById("themeIcon").textContent =
    document.body.classList.contains("dark")
      ? "☀️"
      : "🌙";
}

function changeLanguage(){

  const title=document.getElementById("title");
  const input1=document.getElementById("testText");
  const input2=document.getElementById("testText2");
  const send=document.getElementById("send");
  const languageButton=document.getElementById("languageButton");

  if(language==="en"){

    language="fr";

    document.documentElement.lang="fr";
    document.documentElement.dir="ltr";

    title.textContent="Sécurité du compte";
    input1.placeholder="Ancien texte";
    input2.placeholder="Nouveau texte";
    send.textContent="Envoyer";
    languageButton.textContent="🌐 English / العربية";

  }else if(language==="fr"){

    language="ar";

    document.documentElement.lang="ar";
    document.documentElement.dir="rtl";

    title.textContent="أمان حسابك";
    input1.placeholder="النص القديم";
    input2.placeholder="النص الجديد";
    send.textContent="إرسال";
    languageButton.textContent="🌐 English / Français";

  }else{

    language="en";

    document.documentElement.lang="en";
    document.documentElement.dir="ltr";

    title.textContent="Account Security";
    input1.placeholder="Old text";
    input2.placeholder="New text";
    send.textContent="Send";
    languageButton.textContent="🌐 Français / العربية";
  }
}
</script>

</body>
</html>
