<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أمان حسابك</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#6a5acd,#00bcd4);
  padding:20px;
}

.card{
  width:100%;
  max-width:380px;
  background:white;
  padding:30px 22px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.title{
  font-size:26px;
  font-weight:bold;
  margin-bottom:25px;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#2196f3;
  color:white;
  font-size:13px;
  vertical-align:middle;
}

input{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:11px;
  outline:none;
  font-size:16px;
}

input:focus{
  border-color:#6a5acd;
}

button{
  width:100%;
  margin-top:14px;
  padding:15px;
  border:0;
  border-radius:11px;
  background:linear-gradient(90deg,#6a5acd,#00a8cc);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#eee;
  color:#333;
}

#message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#e9fff0;
  color:#16803c;
}
</style>
</head>

<body>

<div class="card">

  <div class="title">
    أمان حسابك <span class="badge">✓</span>
  </div>

  <input
    id="testText"
    type="text"
    placeholder="اكتب كلمة قوية"
    autocomplete="off"
  >

  <button onclick="testSubmit()">
    إرسال
  </button>

  <div id="message">
    تم بنجاح ✅
  </div>

  <button class="secondary" onclick="toggleDark()">
    🌙 الوضع الليلي
  </button>

</div>

<script>
function testSubmit(){

  const value =
    document.getElementById("testText").value.trim();

  const message =
    document.getElementById("message");

  if(!value){
    message.style.display="block";
    message.style.background="#ffeaea";
    message.style.color="#b00000";
    message.textContent="اكتب أولاً";
    return;
  }

  message.style.display="block";
  message.style.background="#e9fff0";
  message.style.color="#16803c";
  message.textContent="تم بنجاح ✅";
}

function toggleDark(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
